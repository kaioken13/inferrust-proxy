[package]
name = "inferrust-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async Runtime & Web Framework
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
hyper = { version = "1.0", features = ["full"] }
futures = "0.3"

# HTTP Client (para repasse de requisições)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Tracing / Observabilidade Básica
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Caching
moka = { version = "0.12", features = ["future"] }
tower = { version = "0.4", features = ["util", "limit","buffer"] }
sha2 = "0.10"
hex = "0.4"
tokenizers = "0.23.1"

bincode = "1.3.3"
uuid = { version = "1.24.1", features = ["v4"] }

# Rate limit
redis = { version = "0.26", features = ["tokio-comp"] }

# Server Sent Events
tokio-stream = "0.1"

[dev-dependencies]
wiremock = "0.6"
http-body-util = "0.1"
tower = { version = "0.4", features = ["util"] }
