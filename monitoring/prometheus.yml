global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "vectordb-core"
    metrics_path: /metrics
    static_configs:
      - targets: ["vectordb-core:9100"]

  - job_name: "inferrust-proxy"
    metrics_path: /metrics
    static_configs:
      - targets: ["inferrust-proxy:3000"]